name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SECRET_KEY: ci-test-secret-key-min-32-chars-here
  ENVIRONMENT: test
  OPENAI_API_KEY: test
  SMART_API_KEY: test

jobs:
  backend-quality:
    name: Backend lint and import check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt ruff
      - run: ruff check src tests
      - run: python -m compileall -q src

  backend-unit:
    name: Backend unit and contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt -r requirements-test.txt
      - name: V2.5 metrics and pattern cursor order regression
        run: >-
          pytest
          tests/test_agent_v25_evaluation_gate.py::test_v2_metrics_do_not_count_conversion_as_acceptance_or_internal_drafts
          tests/test_pattern_analyzer.py::TestBatchProcessing::test_run_batch_respects_batch_size_limit
          -q --tb=short
      - run: pytest tests --ignore=tests/integration -m "not integration and not soak" -q --tb=short

  backend-agent-v25-gate:
    name: Agent V2.5 fast contract gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt -r requirements-test.txt
      - run: pytest tests/test_agent_v25_evaluation_gate.py -q --tb=short

  backend-migrations:
    name: Alembic lifecycle and release gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: planpilot
          POSTGRES_PASSWORD: password
          POSTGRES_DB: planpilot_migration
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U planpilot -d planpilot_migration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://planpilot:password@localhost:5432/planpilot_migration
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic heads
      - run: alembic upgrade head
      - run: python -m src.release_gate
      - run: alembic downgrade -1
      - run: alembic upgrade head
      - run: python -m src.release_gate

  backend-integration:
    name: Backend PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: planpilot
          POSTGRES_PASSWORD: password
          POSTGRES_DB: planpilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U planpilot -d planpilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://planpilot:password@localhost:5432/planpilot_test
      TEST_DATABASE_URL: postgresql+asyncpg://planpilot:password@localhost:5432/planpilot_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt -r requirements-test.txt
      - run: alembic upgrade head
      - name: Agent V2.5 PostgreSQL runtime safety gate
        run: pytest tests/integration/test_15_agent_v25_runtime_gate.py -q --tb=short
      - name: Remaining PostgreSQL integration tests
        run: pytest tests/integration --ignore=tests/integration/test_15_agent_v25_runtime_gate.py -m "integration and not soak" -q --tb=short

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  frontend-e2e:
    name: Frontend mocked browser contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      PLANPILOT_WEB_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Start frontend
        run: |
          pnpm start > /tmp/planpilot-frontend.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/planpilot-frontend.log
          exit 1
      - run: pnpm exec playwright test --reporter=line
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            frontend/test-results
            frontend/playwright-report

  production-images:
    name: Production compose and image build
    runs-on: ubuntu-latest
    needs:
      - backend-quality
      - backend-unit
      - backend-agent-v25-gate
      - backend-migrations
      - backend-integration
      - frontend-build
      - frontend-e2e
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose
        env:
          POSTGRES_PASSWORD: compose-validation-password
          REDIS_PASSWORD: compose-validation-password
          OBJECT_STORAGE_PASSWORD: compose-object-storage-password
          FRONTEND_URL: https://planpilot.example.test
          CORS_ORIGINS: https://planpilot.example.test
        run: docker compose -f docker-compose.prod.yml config --quiet
      - run: docker build -t planpilot-api ./backend
      - run: docker build -t planpilot-frontend ./frontend
