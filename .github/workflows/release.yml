name: Download Preview Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Archive version, for example 0.1.0-preview.1"
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release scripts and Compose configuration
        shell: bash
        run: |
          bash -n start.sh stop.sh scripts/release/*.sh
          PLANPILOT_NON_INTERACTIVE=1 PLANPILOT_AI_MODE=none scripts/release/configure.sh
          docker compose config --quiet
      - name: Build source archive
        id: archive
        shell: bash
        run: |
          version="${{ github.event.inputs.version || github.ref_name }}"
          archive="PlanPilot-${version}-docker-preview.zip"
          git archive --format=zip --prefix="PlanPilot/" --output="${archive}" HEAD
          sha256sum "${archive}" > "${archive}.sha256"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: planpilot-docker-preview
          path: |
            ${{ steps.archive.outputs.archive }}
            ${{ steps.archive.outputs.archive }}.sha256
      - name: Attach archive to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.archive.outputs.archive }}
            ${{ steps.archive.outputs.archive }}.sha256
