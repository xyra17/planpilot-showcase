<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tech-p" x1="14" y1="14" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDE4FF"/>
    </linearGradient>
    <linearGradient id="tech-mint" x1="23" y1="29" x2="39" y2="8" gradientUnits="userSpaceOnUse">
      <stop stop-color="#49D9CB"/>
      <stop offset="1" stop-color="#7AF2D9"/>
    </linearGradient>
    <filter id="tech-glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
