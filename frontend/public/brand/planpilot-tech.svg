  </defs>

  <!-- The open P is the shared PlanPilot brand shape: a plan becoming a route. -->
  <path d="M14.5 37V25.2C14.5 18.9 18.9 14.5 25.2 14.5H28.4C34 14.5 37.5 17.9 37.5 22.8C37.5 28.2 33.2 32.2 27.6 32.2H22.5"
