  <circle cx="24.4" cy="24.2" r="3.3" fill="#162047" stroke="#FFFFFF" stroke-width="2.4"/>

  <!-- Mint guidance path and destination marker. -->
  <path d="M24.8 24C28.4 20 31.4 16.8 36.8 11.5" stroke="url(#tech-mint)" stroke-width="2.7"
        stroke-linecap="round" stroke-dasharray="2.2 4.2"/>
  <path d="M34.5 8.9L41 8L39.8 14.4L37.9 11.2L34.5 8.9Z" fill="#5DE6D3" filter="url(#tech-glow)"/>
  <circle cx="14.5" cy="37" r="2.4" fill="#52E1CF" stroke="#C7FFF4" stroke-width="0.9" filter="url(#tech-glow)"/>
</svg>
