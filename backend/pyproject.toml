[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["fix_today_and_check.py", "test_seed.py"]

[tool.ruff.lint]
# Keep CI focused on syntax/undefined names, unused code, and deterministic imports.
# FastAPI dependency defaults (B008) and the application's local-date policy are intentional.
select = ["E4", "E7", "E9", "F", "I"]
