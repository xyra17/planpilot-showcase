x-backend: &backend
  build:
    context: ./backend
  env_file:
    - path: ./backend/.env.production
      required: false
  environment:
    TZ: Asia/Shanghai
    DATABASE_URL: postgresql+asyncpg://planpilot:${POSTGRES_PASSWORD}@postgres:5432/planpilot
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    ENVIRONMENT: production
    LOG_LEVEL: INFO
    SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
    FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL}
    CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
    AUTH_COOKIE_SECURE: "true"
    STORAGE_BACKEND: s3
    STORAGE_S3_BUCKET: planpilot
    STORAGE_S3_ENDPOINT_URL: http://minio:9000
    STORAGE_S3_REGION: us-east-1
    STORAGE_S3_ACCESS_KEY: planpilot
    STORAGE_S3_SECRET_KEY: ${OBJECT_STORAGE_PASSWORD:?Set OBJECT_STORAGE_PASSWORD}
    STORAGE_S3_SECURE: "false"
    STORAGE_S3_SERVER_SIDE_ENCRYPTION: ${STORAGE_S3_SERVER_SIDE_ENCRYPTION:-}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  volumes:
    # API 写入原始资料，Worker 读取同一文件完成解析与索引。
    # 挂载整个 uploads，而不是只挂载头像子目录，避免容器重建后原始资料丢失。
    - uploads_data:/app/uploads
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: planpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: planpilot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planpilot -d planpilot"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: planpilot
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_PASSWORD:?Set OBJECT_STORAGE_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 planpilot "$$OBJECT_STORAGE_PASSWORD" &&
        mc mb --ignore-existing local/planpilot &&
        mc anonymous set none local/planpilot
    environment:
      OBJECT_STORAGE_PASSWORD: ${OBJECT_STORAGE_PASSWORD:?Set OBJECT_STORAGE_PASSWORD}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  object-backup:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    profiles: ["ops"]
    entrypoint: ["/bin/sh"]
    environment:
      OBJECT_STORAGE_PASSWORD: ${OBJECT_STORAGE_PASSWORD:?Set OBJECT_STORAGE_PASSWORD}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backup
    depends_on:
      minio:
        condition: service_healthy

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  worker:
    <<: *backend
    command: ["celery", "-A", "src.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.celery_app.celery_app inspect ping --timeout=5 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  beat:
    <<: *backend
    command: ["celery", "-A", "src.celery_app.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  minio_data:
