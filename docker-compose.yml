services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: planpilot
      POSTGRES_PASSWORD: password
      POSTGRES_DB: planpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: ./backend
    command: celery -A src.celery_app.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./backend:/app
    working_dir: /app
    environment:
      REDIS_URL: redis://redis:6379/0
      EMBEDDING_BASE_URL: http://host.docker.internal:1234/v1
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  beat:
    build:
      context: ./backend
    command: celery -A src.celery_app.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    working_dir: /app
    environment:
      REDIS_URL: redis://redis:6379/0
      EMBEDDING_BASE_URL: http://host.docker.internal:1234/v1
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: planpilot
      MINIO_ROOT_PASSWORD: planpilot123
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    working_dir: /app
    environment:
      REDIS_URL: redis://redis:6379/0
      EMBEDDING_BASE_URL: http://host.docker.internal:1234/v1
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: on-failure

volumes:
  postgres_data:
  redis_data:
  minio_data:
