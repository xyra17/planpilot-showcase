services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: planpilot
      POSTGRES_PASSWORD: password
      POSTGRES_DB: planpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: ./backend
    command: celery -A src.celery_app.celery_app worker --loglevel=info --concurrency=2
    # Development bind mounts use host ownership; production stays non-root.
    user: root
    volumes:
      - ./backend:/app
      # /app 已绑定到宿主机 backend；Worker 与 API 因此共用同一 uploads 目录。
    working_dir: /app
    environment:
      TZ: Asia/Shanghai
      REDIS_URL: redis://redis:6379/0
      OPENAI_BASE_URL: http://host.docker.internal:8080/v1
      EMBEDDING_BASE_URL: http://host.docker.internal:1234/v1
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.celery_app.celery_app inspect ping --timeout=5 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  beat:
    build:
      context: ./backend
    command: celery -A src.celery_app.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    # Development bind mounts use host ownership; production stays non-root.
    user: root
    volumes:
      - ./backend:/app
    working_dir: /app
    environment:
      TZ: Asia/Shanghai
      REDIS_URL: redis://redis:6379/0
      OPENAI_BASE_URL: http://host.docker.internal:8080/v1
      EMBEDDING_BASE_URL: http://host.docker.internal:1234/v1
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      disable: true

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: planpilot
      MINIO_ROOT_PASSWORD: planpilot123
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    # Keep the local API stable while frontend and background jobs are running.
    # Source changes are applied with an explicit container restart instead of
    # exposing users to repeated WatchFiles shutdown windows.
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    # Development bind mounts use host ownership; production stays non-root.
    user: root
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    working_dir: /app
    environment:
      TZ: Asia/Shanghai
      REDIS_URL: redis://redis:6379/0
      OPENAI_BASE_URL: http://host.docker.internal:8080/v1
      EMBEDDING_BASE_URL: http://host.docker.internal:1234/v1
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      # One canonical frontend contains both complete UI experiences.
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        API_URL: http://api:8000
    environment:
      TZ: Asia/Shanghai
      API_URL: http://api:8000
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      - api
    restart: on-failure

volumes:
  postgres_data:
  redis_data:
  minio_data:
