services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: planpilot
      POSTGRES_PASSWORD: ${PLANPILOT_DB_PASSWORD:?Run start.sh or start.ps1 to initialize PlanPilot}
      POSTGRES_DB: planpilot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: ./backend
    command: alembic upgrade head
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://planpilot:${PLANPILOT_DB_PASSWORD}@postgres:5432/planpilot
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${PLANPILOT_SECRET_KEY}
      LOCAL_MODEL_ENABLED: "false"
      OPENAI_BASE_URL: ""
      EMBEDDING_BASE_URL: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  worker:
    build:
      context: ./backend
    command: celery -A src.celery_app.celery_app worker --loglevel=info --concurrency=2
    # Development bind mounts use host ownership; production stays non-root.
    user: root
    volumes:
      - ./backend:/app
      # /app 已绑定到宿主机 backend；Worker 与 API 因此共用同一 uploads 目录。
    working_dir: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql+asyncpg://planpilot:${PLANPILOT_DB_PASSWORD}@postgres:5432/planpilot
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${PLANPILOT_SECRET_KEY}
      OPENAI_BASE_URL: ${PLANPILOT_LOCAL_LLM_URL:-}
      EMBEDDING_BASE_URL: ${PLANPILOT_EMBEDDING_URL:-}
      LOCAL_MODEL_MAX_CONCURRENCY: ${PLANPILOT_LOCAL_MODEL_MAX_CONCURRENCY:-1}
      LOCAL_MODEL_QUEUE_TIMEOUT_SECONDS: ${PLANPILOT_LOCAL_MODEL_QUEUE_TIMEOUT_SECONDS:-2}
      STORAGE_BACKEND: s3
      STORAGE_LOCAL_ROOT: /app/uploads
      STORAGE_S3_BUCKET: planpilot
      STORAGE_S3_ENDPOINT_URL: http://minio:9000
      STORAGE_S3_REGION: us-east-1
      STORAGE_S3_ACCESS_KEY: planpilot
      STORAGE_S3_SECRET_KEY: ${PLANPILOT_MINIO_PASSWORD}
      STORAGE_S3_SECURE: "false"
      STORAGE_S3_FALLBACK_TO_LOCAL: "true"
      STORAGE_PROBE_TIMEOUT_SECONDS: "3"
    env_file:
      - ./backend/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.celery_app.celery_app inspect ping --timeout=5 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  beat:
    build:
      context: ./backend
    command: celery -A src.celery_app.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    # Development bind mounts use host ownership; production stays non-root.
    user: root
    volumes:
      - ./backend:/app
    working_dir: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql+asyncpg://planpilot:${PLANPILOT_DB_PASSWORD}@postgres:5432/planpilot
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${PLANPILOT_SECRET_KEY}
      OPENAI_BASE_URL: ${PLANPILOT_LOCAL_LLM_URL:-}
      EMBEDDING_BASE_URL: ${PLANPILOT_EMBEDDING_URL:-}
      LOCAL_MODEL_MAX_CONCURRENCY: ${PLANPILOT_LOCAL_MODEL_MAX_CONCURRENCY:-1}
      LOCAL_MODEL_QUEUE_TIMEOUT_SECONDS: ${PLANPILOT_LOCAL_MODEL_QUEUE_TIMEOUT_SECONDS:-2}
    env_file:
      - ./backend/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      disable: true

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: planpilot
      MINIO_ROOT_PASSWORD: ${PLANPILOT_MINIO_PASSWORD}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 planpilot ${PLANPILOT_MINIO_PASSWORD} &&
        mc mb --ignore-existing local/planpilot
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    # Keep the local API stable while frontend and background jobs are running.
    # Source changes are applied with an explicit container restart instead of
    # exposing users to repeated WatchFiles shutdown windows.
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    # Development bind mounts use host ownership; production stays non-root.
    user: root
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    working_dir: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql+asyncpg://planpilot:${PLANPILOT_DB_PASSWORD}@postgres:5432/planpilot
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${PLANPILOT_SECRET_KEY}
      OPENAI_BASE_URL: ${PLANPILOT_LOCAL_LLM_URL:-}
      EMBEDDING_BASE_URL: ${PLANPILOT_EMBEDDING_URL:-}
      LOCAL_MODEL_MAX_CONCURRENCY: ${PLANPILOT_LOCAL_MODEL_MAX_CONCURRENCY:-1}
      LOCAL_MODEL_QUEUE_TIMEOUT_SECONDS: ${PLANPILOT_LOCAL_MODEL_QUEUE_TIMEOUT_SECONDS:-2}
      STORAGE_BACKEND: s3
      STORAGE_LOCAL_ROOT: /app/uploads
      STORAGE_S3_BUCKET: planpilot
      STORAGE_S3_ENDPOINT_URL: http://minio:9000
      STORAGE_S3_REGION: us-east-1
      STORAGE_S3_ACCESS_KEY: planpilot
      STORAGE_S3_SECRET_KEY: ${PLANPILOT_MINIO_PASSWORD}
      STORAGE_S3_SECURE: "false"
      STORAGE_S3_FALLBACK_TO_LOCAL: "true"
      STORAGE_PROBE_TIMEOUT_SECONDS: "3"
    env_file:
      - ./backend/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      # One canonical frontend contains both complete UI experiences.
      context: ./frontend
      # Desktop and browser users consume an immutable production build. Keeping
      # Next's runtime output inside the image prevents host cache cleanup from
      # removing files from a running workspace.
      target: runner
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        API_URL: http://api:8000
    environment:
      TZ: Asia/Shanghai
      API_URL: http://api:8000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      - api
    restart: on-failure

volumes:
  postgres_data:
  redis_data:
  minio_data:
